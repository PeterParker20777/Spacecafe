
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="Space Cafe | Menu">
  <meta property="og:description" content="Good Food .. Good Mood — explore our menu.">
  <meta property="og:image" content="assets/space-cafe-logo.png">
  <link rel="icon" type="image/png" href="assets/space-cafe-logo.png">
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <meta name="description" content="Explore the Space Cafe menu — coffee, drinks, desserts and food.">
  <title>Space Cafe | Menu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="topbar">
    <button class="icon-button" id="menuButton" aria-label="Scroll to menu">☰</button>

    <a class="brand" href="#home" aria-label="Space Cafe home">
      <img src="assets/space-cafe-logo.png" alt="Space Cafe logo" width="160" height="76" fetchpriority="high">
    </a>

    <a class="icon-button cup-icon" href="#menu" aria-label="View menu">☕</a>
  </header>

  <main>
    <section class="hero" id="home">
      <div class="hero-copy">
        <span class="eyebrow">WELCOME TO</span>
        <h1>Space Cafe</h1>
        <p>Good Food .. Good Mood</p>
        <span class="hero-line"></span>
      </div>

      <img
        class="hero-image"
        src="https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=1000&q=85"
        alt="Iced coffee in a glass"
        fetchpriority="high"
        decoding="async"
        onerror="this.style.display='none'"
      >
    </section>

    <section class="menu-section" id="menu">
      <div class="section-heading">
        <div>
          <span class="eyebrow">WHAT WOULD YOU LIKE?</span>
          <h2>Our Menu</h2>
        </div>
      </div>

      <nav class="categories" id="categories" aria-label="Menu categories" role="tablist">
        <button class="category active" data-category="Coffee" role="tab" aria-selected="true">☕ <span>Coffee</span></button>
        <button class="category" data-category="Drinks" role="tab" aria-selected="false">🥤 <span>Drinks</span></button>
        <button class="category" data-category="Desserts" role="tab" aria-selected="false">🍰 <span>Desserts</span></button>
        <button class="category" data-category="Food" role="tab" aria-selected="false">🍴 <span>Food</span></button>
      </nav>

      <div class="menu-grid" id="menuGrid" role="tabpanel" aria-live="polite"></div>
    </section>

    <section class="review-section">
      <div class="review-card">
        <div class="review-icon">♥</div>

        <h2>Enjoyed Your Visit?</h2>
        <p>Your opinion means a lot to us. Leave a review on Google!</p>

        <div class="stars" aria-label="5 stars">★★★★★</div>

        <div class="review-actions">
          <a
            class="secondary-button"
            href="https://www.google.com/maps/place/Space+cafe/@30.678334,31.6010122,187m/data=!3m2!1e3!4b1!4m6!3m5!1s0x14f7f50066ae4163:0x423a6e11be603869!8m2!3d30.678334!4d31.6003685!16s%2Fg%2F11wp1d0m7m"
            target="_blank"
            rel="noopener noreferrer"
          >
            Rate Us on Google <span>↗</span>
          </a>
        </div>

        <small>Choose Reviews to leave your feedback.</small>
      </div>
    </section>
  </main>

  <footer>
    <img src="assets/space-cafe-logo.png" alt="Space Cafe logo" width="100" height="58" loading="lazy">
    <p>Enjoy Your Time ♥</p>
    <span>© <span id="year"></span> Space Cafe</span>
  </footer>

  <footer class="made-by">
    Made By PeterParker 🕷️
  </footer>

  <button class="to-top" id="toTop" aria-label="Back to top">↑</button>

  <script src="script.js"></script>
</body>
</html>
