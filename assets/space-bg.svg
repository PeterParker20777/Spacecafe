
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1800" width="1440" height="1800">
  <defs>
    <radialGradient id="saturnBody" cx="32%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#fff3dc"/>
      <stop offset="48%" stop-color="#e9c99f"/>
      <stop offset="100%" stop-color="#c69b70"/>
    </radialGradient>
    <linearGradient id="saturnRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e7cf"/>
      <stop offset="45%" stop-color="#cba77f"/>
      <stop offset="75%" stop-color="#ead6b9"/>
      <stop offset="100%" stop-color="#b58e67"/>
    </linearGradient>
    <radialGradient id="bluePlanet" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#f1f5f7"/>
      <stop offset="55%" stop-color="#cbd8df"/>
      <stop offset="100%" stop-color="#8da5b2"/>
    </radialGradient>
    <radialGradient id="moonBody" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="70%" stop-color="#e8e0d5"/>
      <stop offset="100%" stop-color="#c9bca9"/>
    </radialGradient>
    <radialGradient id="peachPlanet" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#fff0df"/>
      <stop offset="60%" stop-color="#e9c3a1"/>
      <stop offset="100%" stop-color="#bd8e70"/>
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="saturnClip">
      <circle cx="0" cy="0" r="92"/>
    </clipPath>
    <clipPath id="blueClip">
      <circle cx="0" cy="0" r="67"/>
    </clipPath>
  </defs>

  <rect width="1440" height="1800" fill="#fff"/>

  <!-- Subtle stars -->
  <g fill="#d4b895" opacity=".55">
    <circle cx="180" cy="180" r="2"/>
    <circle cx="390" cy="95" r="2.5"/>
    <circle cx="1110" cy="145" r="2"/>
    <circle cx="1280" cy="330" r="2.5"/>
    <circle cx="90" cy="700" r="2"/>
    <circle cx="1320" cy="750" r="2"/>
    <circle cx="300" cy="1040" r="2.5"/>
    <circle cx="1080" cy="1180" r="2"/>
    <circle cx="180" cy="1450" r="2"/>
    <circle cx="1190" cy="1580" r="2.5"/>
    <circle cx="850" cy="1710" r="2"/>
  </g>

  <!-- Tiny four-point stars -->
  <g fill="#e5c9a8" opacity=".65">
    <path d="M270 350 Q275 370 295 375 Q275 380 270 400 Q265 380 245 375 Q265 370 270 350Z"/>
    <path d="M1170 450 Q1175 468 1193 473 Q1175 478 1170 496 Q1165 478 1147 473 Q1165 468 1170 450Z"/>
    <path d="M350 1250 Q355 1268 373 1273 Q355 1278 350 1296 Q345 1278 327 1273 Q345 1268 350 1250Z"/>
    <path d="M1040 1450 Q1045 1468 1063 1473 Q1045 1478 1040 1496 Q1035 1478 1017 1473 Q1035 1468 1040 1450Z"/>
  </g>

  <!-- Saturn upper right -->
  <g transform="translate(1320 230) rotate(-22)" opacity=".56">
    <ellipse cx="0" cy="0" rx="155" ry="43" fill="none" stroke="#e5d0b4" stroke-width="25"/>
    <ellipse cx="0" cy="0" rx="155" ry="43" fill="none" stroke="url(#saturnRing)" stroke-width="13"/>
    <ellipse cx="0" cy="0" rx="125" ry="33" fill="none" stroke="#f7ead9" stroke-width="3"/>
    <circle r="92" fill="url(#saturnBody)"/>
    <g clip-path="url(#saturnClip)" opacity=".3" fill="none" stroke="#b88f6a">
      <path d="M-100 -35 Q0 -5 100 -35" stroke-width="9"/>
      <path d="M-100 5 Q0 30 100 5" stroke-width="7"/>
      <path d="M-100 42 Q0 62 100 42" stroke-width="5"/>
    </g>
    <ellipse cx="0" cy="0" rx="155" ry="43" fill="none" stroke="#c49e78" stroke-width="3"/>
  </g>

  <!-- Small crater moon -->
  <g transform="translate(145 510)" opacity=".55">
    <circle r="49" fill="url(#moonBody)"/>
    <g fill="#cbbda9" opacity=".65">
      <circle cx="-15" cy="-12" r="9"/>
      <circle cx="18" cy="12" r="6"/>
      <circle cx="-5" cy="27" r="4"/>
      <circle cx="22" cy="-22" r="3"/>
    </g>
    <g fill="none" stroke="#fff" stroke-width="3" opacity=".7">
      <circle cx="-15" cy="-12" r="9"/>
      <circle cx="18" cy="12" r="6"/>
    </g>
  </g>

  <!-- Blue planet left -->
  <g transform="translate(-5 1010)" opacity=".48">
    <circle cx="0" cy="0" r="85" fill="#cbd8df" opacity=".25" filter="url(#softShadow)"/>
    <circle r="67" fill="url(#bluePlanet)"/>
    <g clip-path="url(#blueClip)" fill="none" stroke="#8ca5b2" opacity=".45">
      <path d="M-75 -30 Q0 -65 75 -30" stroke-width="9"/>
      <path d="M-75 2 Q0 -15 75 2" stroke-width="12"/>
      <path d="M-75 35 Q0 12 75 35" stroke-width="8"/>
    </g>
    <path d="M-45 -43 Q-10 -68 25 -55" fill="none" stroke="#fff" stroke-width="8" opacity=".4"/>
  </g>

  <!-- Peach planet lower right -->
  <g transform="translate(1360 1190)" opacity=".48">
    <circle r="77" fill="url(#peachPlanet)"/>
    <path d="M-70 -18 Q0 -42 70 -18" fill="none" stroke="#fff0df" stroke-width="9" opacity=".5"/>
    <path d="M-70 18 Q0 0 70 18" fill="none" stroke="#b98161" stroke-width="7" opacity=".25"/>
    <path d="M-50 48 Q0 30 50 48" fill="none" stroke="#b98161" stroke-width="5" opacity=".2"/>
  </g>

  <!-- Small orbiting moon -->
  <g transform="translate(1130 880)" opacity=".5">
    <circle r="30" fill="url(#moonBody)"/>
    <circle cx="-8" cy="-5" r="5" fill="#cbbda9"/>
    <circle cx="10" cy="9" r="4" fill="#cbbda9"/>
    <circle cx="12" cy="-12" r="2.5" fill="#cbbda9"/>
  </g>

  <!-- Saturn lower left -->
  <g transform="translate(100 1600) rotate(18)" opacity=".5">
    <ellipse cx="0" cy="0" rx="125" ry="35" fill="none" stroke="#e8d3b8" stroke-width="22"/>
    <ellipse cx="0" cy="0" rx="125" ry="35" fill="none" stroke="url(#saturnRing)" stroke-width="11"/>
    <circle r="70" fill="url(#saturnBody)"/>
    <path d="M-65 -20 Q0 -38 65 -20" fill="none" stroke="#b88f6a" stroke-width="7" opacity=".3"/>
    <path d="M-65 15 Q0 30 65 15" fill="none" stroke="#b88f6a" stroke-width="6" opacity=".3"/>
  </g>

  <!-- Fine orbital paths -->
  <g fill="none" stroke="#e8d9c7" stroke-width="1.5" opacity=".45">
    <ellipse cx="720" cy="600" rx="120" ry="38" transform="rotate(-18 720 600)" stroke-dasharray="4 12"/>
    <ellipse cx="710" cy="1370" rx="150" ry="45" transform="rotate(15 710 1370)" stroke-dasharray="3 13"/>
  </g>
</svg>
